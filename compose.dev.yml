services:
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8084:8080"

  task-manager:
    environment:
      JWT_SECRET: task-manager-dev-jwt-secret-key-2026-super-secure-32-bytes-minimum
      JAVA_TOOL_OPTIONS: >
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    ports:
      - "8081:8080"
      - "5005:5005"

  scheduler:
    ports:
      - "8082:8080"

  mail-sender:
    ports:
      - "8083:8080"

  web:
    ports:
      - "8080:80"

  db:
    ports:
      - "5432:5432"

  kafka:
    ports:
      - "9092:9092"
