app:
  jwt:
    secret:  ${JWT_SECRET}
    access-token-expiration: 15m
  internal-token: internal-token
server:
  port: 8080
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://db:5432/tm_db
    username: user
    password: password
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  liquibase:
    change-log: classpath:liquibase/changelog.yml
springdoc:
  override-with-generic-response: false
logging:
  level:
    org.springframework.security: TRACE
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
